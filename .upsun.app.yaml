name: app
type: "python:3.11"
hooks:
  build: |
    apt-get update && apt-get install -y nginx
web:
  upstream:
    socket_family: tcp
    protocol: http
  commands:
    start: |
      cp /app/nginx.conf /etc/nginx/conf.d/default.conf
      nginx -g "daemon off;"
  locations:
    "/":
      passthru: true
